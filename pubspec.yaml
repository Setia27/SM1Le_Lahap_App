name: agenda_tendik
description: "Aplikasi Agen SM1Le - SMAN 1 Lembang"
publish_to: 'none'

version: 1.0.2+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  http: ^1.2.2
  intl: ^0.19.0
  flutter_image_compress: ^2.5.1
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_sekolah.png
    - assets/images/logo_disdik.png
    - assets/images/logo_lebah.png

flutter_native_splash:
  color: "#29B6F6"                         # Warna biru senada dengan SplashScreen Anda
  image: "assets/images/logo_lebah_splash.png"    # Logo lebah Anda
  android: true
  ios: true
  web: false

  # Khusus Android 12 ke atas (wajib diatur agar logo tidak terpotong)
  android_12:
    image: "assets/images/logo_lebah_splash.png"
    color: "#29B6F6"
    icon_background_color: "#29B6F6"